name: fc26_conquest
description: FC 26 Conquest desktop app for Windows.
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  http: ^1.2.2
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/teams_seed.json
    - assets/data/regions_seed.json
    - assets/data/players_seed.json
    - assets/logos/
    - assets/maps/
