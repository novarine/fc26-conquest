[project]
name = "fc26-data-pipeline"
version = "0.1.0"
description = "Source-normalizing data pipeline for FC 26 Conquest"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pandas>=2.0",
  "pydantic>=2.0",
  "jsonschema>=4.0"
]

[project.scripts]
fc26-data = "fc26_data.cli:main"
